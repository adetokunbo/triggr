[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triggr"
version = "0.1.0"
description = "Composable async trigger framework"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "basedpyright",
    "ruff",
    "pre-commit",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.basedpyright]
pythonVersion = "3.11"
include = ["triggr"]
typeCheckingMode = "strict"

[tool.hatch.build.targets.wheel]
packages = ["triggr"]
