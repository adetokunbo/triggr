[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triggr"
version = "0.1.0"
description = "Composable async trigger framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Tim Emiola", email = "adetokunbo@emio.la" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Framework :: AsyncIO",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Source = "https://github.com/adetokunbo/triggr"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "basedpyright",
    "ruff",
    "pre-commit",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.basedpyright]
pythonVersion = "3.11"
include = ["triggr"]
typeCheckingMode = "strict"

[tool.hatch.build.targets.wheel]
packages = ["triggr"]
