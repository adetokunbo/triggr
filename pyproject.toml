[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triggr"
version = "0.1.0"
description = "Composable async trigger framework"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["triggr"]
